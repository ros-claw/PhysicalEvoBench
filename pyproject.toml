[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "physicalevobench"
version = "0.1.0"
description = "Auditable physical-feedback skill adaptation evaluation on Isaac Lab-Arena"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]
models = ["huggingface-hub==0.35.3"]

[project.scripts]
physicalevobench = "physicalevobench.cli:main"
physicalevobench-core = "physicalevobench.core.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
